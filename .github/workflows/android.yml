name: Android CI & Debug APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Run Unit Tests & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Install Required Components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ] && [ -d "/opt/android/sdk" ]; then
            SDK_ROOT="/opt/android/sdk"
          fi
          mkdir -p "$SDK_ROOT"
          if [ -n "${GITHUB_ENV:-}" ]; then
            echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          fi

          SDKMANAGER=""
          for candidate in \
            "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Error: sdkmanager not found under ${SDK_ROOT}"
            exit 1
          fi

          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
            echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platforms;android-36.1"

      - name: Cache Robolectric Instrumented Android SDK Jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: ${{ runner.os }}-robolectric-sdk-34-4.16.1
          restore-keys: |
            ${{ runner.os }}-robolectric-sdk-

      - name: Setup Gradle 9.3.1 & Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ] && [ -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ]; then
            base64 --decode "${GITHUB_WORKSPACE}/debug.keystore.base64" > "${GITHUB_WORKSPACE}/debug.keystore"
          elif [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest -Drobolectric.enabledSdks=34 --stacktrace
          else
            gradle :app:testDebugUnitTest -Drobolectric.enabledSdks=34 --stacktrace
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi
          if [ ! -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Expected debug APK not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          if-no-files-found: error
          retention-days: 30
          path: app/build/outputs/apk/debug/app-debug.apk
