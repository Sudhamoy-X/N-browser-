name: NYXORA Browser Android Build & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
      - 'v*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g., v2.6.4). Leave empty for automatic version increment.'
        required: false
        default: ''
      publish_release:
        description: 'Publish signed APK to GitHub Releases after tests and build pass'
        required: false
        type: boolean
        default: true
      release_notes:
        description: 'Release highlights (used when publishing a GitHub Release)'
        required: false
        default: 'Stable NYXORA Browser Android release with automatic in-app update support.'

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Test, Build Signed Release APK & Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NYXORA Browser Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Install Required Components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ] && [ -d "/opt/android/sdk" ]; then
            SDK_ROOT="/opt/android/sdk"
          fi
          mkdir -p "$SDK_ROOT"
          if [ -n "${GITHUB_ENV:-}" ]; then
            echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          fi

          SDKMANAGER=""
          for candidate in \
            "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Error: sdkmanager not found under ${SDK_ROOT}"
            exit 1
          fi

          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
            echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
            echo "${SDK_ROOT}/build-tools/36.0.0" >> "$GITHUB_PATH"
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platforms;android-36.1"

      - name: Cache Robolectric Instrumented Android SDK Jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: ${{ runner.os }}-robolectric-sdk-34-4.16.1
          restore-keys: |
            ${{ runner.os }}-robolectric-sdk-

      - name: Setup Gradle 9.3.1 & Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve Automatic Semantic Version & Monotonic VersionCode
        id: version_meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          GRADLE_VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          GRADLE_VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          GRADLE_VERSION_NAME="${GRADLE_VERSION_NAME:-2.5}"
          GRADLE_VERSION_CODE="${GRADLE_VERSION_CODE:-3}"

          # Query latest published GitHub Release (if any) to ensure versionCode and versionName strictly increase
          LATEST_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO_SLUG}/releases/latest" 2>/dev/null || echo "{}")

          PUBLISHED_TAG=$(python3 -c '
          import json, sys
          try:
              data = json.loads(sys.stdin.read() or "{}")
              print(data.get("tag_name", "").strip())
          except Exception:
              print("")
          ' <<< "$LATEST_JSON")

          PUBLISHED_CODE=$(python3 -c '
          import json, re, sys
          try:
              data = json.loads(sys.stdin.read() or "{}")
              body = data.get("body", "") or ""
              m = re.search(r"(?i)version[\s_-]*code[\s*:=-]+`?(\d+)`?", body)
              if m:
                  print(int(m.group(1)))
              else:
                  print(0)
          except Exception:
              print(0)
          ' <<< "$LATEST_JSON")

          MAX_EXISTING_CODE="$GRADLE_VERSION_CODE"
          if [ "${PUBLISHED_CODE:-0}" -gt "$MAX_EXISTING_CODE" ]; then
            MAX_EXISTING_CODE="$PUBLISHED_CODE"
          fi

          SHOULD_PUBLISH="true"
          RAW_TAG=""

          if [[ "${{ github.ref }}" == refs/tags/v* ]] || [[ "${{ github.ref }}" == refs/tags/V* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            SHOULD_PUBLISH="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag_name }}"
            if [ -n "$INPUT_TAG" ]; then
              RAW_TAG="$INPUT_TAG"
            fi
            if [ "${{ github.event.inputs.publish_release }}" = "false" ]; then
              SHOULD_PUBLISH="false"
            fi
          fi

          if [ -n "$RAW_TAG" ]; then
            CLEAN_VERSION="${RAW_TAG#v}"
            CLEAN_VERSION="${CLEAN_VERSION#V}"
            if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "Error: Tag '$RAW_TAG' must be a stable semantic version (e.g., v2.6.4)"
              exit 1
            fi
            VERSION_NAME="$CLEAN_VERSION"
            VERSION_CODE=$(( MAX_EXISTING_CODE + 1 ))
            TAG_NAME="v${VERSION_NAME}"
          else
            # Automatic version increment on workflow_dispatch without tag
            VERSION_CODE=$(( MAX_EXISTING_CODE + 1 ))
            VERSION_NAME=$(python3 -c '
          import re, sys
          gradle_ver = sys.argv[1].lstrip("vV").strip()
          pub_tag = sys.argv[2].lstrip("vV").strip()
          next_code = int(sys.argv[3])

          def parse_parts(v):
              nums = [int(x) for x in re.findall(r"\d+", v)]
              while len(nums) < 2:
                  nums.append(0)
              return nums[:3]

          g_parts = parse_parts(gradle_ver)
          p_parts = parse_parts(pub_tag) if pub_tag else [0, 0, 0]
          base = g_parts if g_parts >= p_parts else p_parts

          if not pub_tag and g_parts > [2, 5]:
              candidate = ".".join(str(x) for x in g_parts)
          else:
              major, minor = base[0], base[1]
              patch = (base[2] + 1) if len(base) > 2 else next_code
              if [major, minor, patch] <= base:
                  patch = base[-1] + 1
              candidate = f"{major}.{minor}.{patch}"
          print(candidate)
          ' "$GRADLE_VERSION_NAME" "$PUBLISHED_TAG" "$VERSION_CODE")
            TAG_NAME="v${VERSION_NAME}"
          fi

          echo "Resolved Automatic Release Version: versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}, tag=${TAG_NAME}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "min_supported_version_code=1" >> "$GITHUB_OUTPUT"
          echo "should_publish_release=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Prepare Persistent Release & Debug Signing Keystores
        id: signing_setup
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NYXORA_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.NYXORA_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.NYXORA_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NYXORA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # 1. Ensure deterministic debug.keystore is decoded from repository's persistent debug.keystore.base64
          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ] && [ -s "${GITHUB_WORKSPACE}/debug.keystore.base64" ]; then
            base64 --decode "${GITHUB_WORKSPACE}/debug.keystore.base64" > "${GITHUB_WORKSPACE}/debug.keystore"
          elif [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            echo "Error: Persistent signing key is missing. Ensure debug.keystore.base64 exists or configure signing secrets."
            exit 1
          fi

          # 2. Prepare persistent release keystore at ${GITHUB_WORKSPACE}/my-upload-key.jks with alias 'upload'
          TARGET_RELEASE_KS="${GITHUB_WORKSPACE}/my-upload-key.jks"
          rm -f "$TARGET_RELEASE_KS"

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$TARGET_RELEASE_KS"
            SRC_ALIAS="${RELEASE_KEY_ALIAS:-upload}"
            if [ "$SRC_ALIAS" != "upload" ]; then
              keytool -changealias \
                -keystore "$TARGET_RELEASE_KS" \
                -storepass "$RELEASE_STORE_PASSWORD" \
                -keypass "$RELEASE_KEY_PASSWORD" \
                -alias "$SRC_ALIAS" \
                -destalias "upload" || true
            fi
            echo "keystore_path=${TARGET_RELEASE_KS}" >> "$GITHUB_OUTPUT"
            echo "store_password=${RELEASE_STORE_PASSWORD}" >> "$GITHUB_OUTPUT"
            echo "key_password=${RELEASE_KEY_PASSWORD}" >> "$GITHUB_OUTPUT"
          else
            # Import the persistent repository key from debug.keystore into my-upload-key.jks under alias 'upload'
            keytool -importkeystore \
              -srckeystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -srcstorepass android \
              -srckeypass android \
              -srcalias androiddebugkey \
              -destkeystore "$TARGET_RELEASE_KS" \
              -deststoretype PKCS12 \
              -deststorepass android \
              -destkeypass android \
              -destalias upload \
              -noprompt
            echo "keystore_path=${TARGET_RELEASE_KS}" >> "$GITHUB_OUTPUT"
            echo "store_password=android" >> "$GITHUB_OUTPUT"
            echo "key_password=android" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize Version Metadata in app/build.gradle.kts
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="${{ steps.version_meta.outputs.version_name }}"
          VERSION_CODE="${{ steps.version_meta.outputs.version_code }}"
          sed -i "s/versionCode = [0-9]\+/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]\+\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

      - name: Run Unit & Robolectric Verification Tests
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing_setup.outputs.keystore_path }}
          STORE_PASSWORD: ${{ steps.signing_setup.outputs.store_password }}
          KEY_PASSWORD: ${{ steps.signing_setup.outputs.key_password }}
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest -Drobolectric.enabledSdks=34 -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2 --stacktrace
          else
            gradle :app:testDebugUnitTest -Drobolectric.enabledSdks=34 -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2 --stacktrace
          fi

      - name: Build Signed Release & Debug APKs and Validate Package & Signature
        id: build_apk
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing_setup.outputs.keystore_path }}
          STORE_PASSWORD: ${{ steps.signing_setup.outputs.store_password }}
          KEY_PASSWORD: ${{ steps.signing_setup.outputs.key_password }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION_NAME="${{ steps.version_meta.outputs.version_name }}"
          VERSION_CODE="${{ steps.version_meta.outputs.version_code }}"
          TAG_NAME="${{ steps.version_meta.outputs.tag_name }}"
          MIN_SUPPORTED_CODE="${{ steps.version_meta.outputs.min_supported_version_code }}"

          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
          else
            gradle :app:assembleDebug :app:assembleRelease --stacktrace
          fi

          DEBUG_APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$DEBUG_APK_PATH" ]; then
            echo "Error: Expected debug APK was not produced at $DEBUG_APK_PATH"
            exit 1
          fi

          RELEASE_APK_PATH=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | grep -v "unsigned" | head -n 1 || true)
          if [ -z "$RELEASE_APK_PATH" ] || [ ! -s "$RELEASE_APK_PATH" ]; then
            echo "Error: Expected signed release APK was not produced under app/build/outputs/apk/release/"
            exit 1
          fi

          RELEASE_APK_NAME="nyxora-browser-v${VERSION_NAME}-b${VERSION_CODE}.apk"
          cp "$RELEASE_APK_PATH" "$RELEASE_APK_NAME"

          # Verify APK package name, versionCode, versionName, and cryptographic signature
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2_BIN=$(find "$SDK_ROOT/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1 || command -v aapt2 || true)
          APKSIGNER_BIN=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || command -v apksigner || true)

          if [ -n "$AAPT2_BIN" ] && [ -x "$AAPT2_BIN" ]; then
            BADGING=$("$AAPT2_BIN" dump badging "$RELEASE_APK_NAME")
            echo "$BADGING" | head -n 5
            echo "$BADGING" | grep -q "name='com.aistudio.nyxorabrowser.vqxkpl'"
            echo "$BADGING" | grep -q "versionCode='${VERSION_CODE}'"
            echo "$BADGING" | grep -q "versionName='${VERSION_NAME}'"
          fi

          if [ -n "$APKSIGNER_BIN" ] && [ -x "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify --verbose --print-certs "$RELEASE_APK_NAME"
          fi

          SHA256_SUM=$(sha256sum "$RELEASE_APK_NAME" | awk '{print $1}')
          echo "${SHA256_SUM}  ${RELEASE_APK_NAME}" > "${RELEASE_APK_NAME}.sha256"

          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DOWNLOAD_URL="https://github.com/${REPO_SLUG}/releases/download/${TAG_NAME}/${RELEASE_APK_NAME}"
          RELEASE_NOTES_TEXT="${{ github.event.inputs.release_notes || 'Automatic NYXORA Browser signed Android release.' }}"

          python3 -c '
          import json, sys
          metadata = {
              "package_name": "com.aistudio.nyxorabrowser.vqxkpl",
              "tag_name": sys.argv[1],
              "version_name": sys.argv[2],
              "version_code": int(sys.argv[3]),
              "min_supported_version_code": int(sys.argv[4]),
              "release_notes": sys.argv[5],
              "apk_asset_name": sys.argv[6],
              "apk_download_url": sys.argv[7],
              "sha256": sys.argv[8],
              "published_at": sys.argv[9]
          }
          with open("release-metadata.json", "w", encoding="utf-8") as f:
              json.dump(metadata, f, indent=2)
          ' "$TAG_NAME" "$VERSION_NAME" "$VERSION_CODE" "$MIN_SUPPORTED_CODE" "$RELEASE_NOTES_TEXT" "$RELEASE_APK_NAME" "$DOWNLOAD_URL" "$SHA256_SUM" "$PUBLISHED_AT"

          echo "debug_apk_path=${DEBUG_APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "apk_file=${RELEASE_APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256_file=${RELEASE_APK_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "metadata_file=release-metadata.json" >> "$GITHUB_OUTPUT"
          echo "sha256_sum=${SHA256_SUM}" >> "$GITHUB_OUTPUT"
          echo "published_at=${PUBLISHED_AT}" >> "$GITHUB_OUTPUT"

      - name: Upload NYXORA Browser APK Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NYXORA-Browser-v${{ steps.version_meta.outputs.version_name }}-b${{ steps.version_meta.outputs.version_code }}-APK
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.build_apk.outputs.apk_file }}
            ${{ steps.build_apk.outputs.sha256_file }}
            ${{ steps.build_apk.outputs.metadata_file }}

      - name: Publish Versioned GitHub Release with Signed APK Asset
        if: success() && steps.version_meta.outputs.should_publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.tag_name }}
          name: "NYXORA Browser ${{ steps.version_meta.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ${{ github.event.inputs.release_notes || 'Stable NYXORA Browser Android release with automatic in-app update support.' }}

            ### Release Metadata
            - **Package ID:** `com.aistudio.nyxorabrowser.vqxkpl`
            - **Version Name:** `${{ steps.version_meta.outputs.version_name }}`
            - **Version Code:** `${{ steps.version_meta.outputs.version_code }}`
            - **Min Supported Version Code:** `${{ steps.version_meta.outputs.min_supported_version_code }}`
            - **APK Asset:** `${{ steps.build_apk.outputs.apk_file }}`
            - **SHA-256 Checksum:** `${{ steps.build_apk.outputs.sha256_sum }}`
            - **Published At:** `${{ steps.build_apk.outputs.published_at }}`
          files: |
            ${{ steps.build_apk.outputs.apk_file }}
            ${{ steps.build_apk.outputs.sha256_file }}
            ${{ steps.build_apk.outputs.metadata_file }}

      - name: Remove Temporary Keystore Files After Build
        if: always()
        shell: bash
        run: |
          rm -f "${GITHUB_WORKSPACE}/debug.keystore"
          rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"

