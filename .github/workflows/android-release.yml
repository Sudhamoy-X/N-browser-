name: NYXORA Browser Android Release APK

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g., v2.5)'
        required: true
        default: 'v2.5'
      release_notes:
        description: 'Release highlights'
        required: false
        default: 'Stable NYXORA Browser Android release with in-app update support.'

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build, Verify & Publish Signed APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NYXORA Browser Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Version Tag & Code
        id: version_meta
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          CLEAN_VERSION="${RAW_TAG#v}"
          CLEAN_VERSION="${CLEAN_VERSION#V}"
          if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Error: Tag '$RAW_TAG' must be a stable semantic version (e.g., v2.5)"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH _ <<< "${CLEAN_VERSION}.0.0"
          COMPUTED_VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "$COMPUTED_VERSION_CODE" -lt 1 ]; then
            COMPUTED_VERSION_CODE=1
          fi
          echo "tag_name=v${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${COMPUTED_VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Prepare Signing Keystore from GitHub Secrets
        id: signing_setup
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NYXORA_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.NYXORA_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.NYXORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "keystore_path=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_OUTPUT"
            echo "build_task=:app:assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_glob=app/build/outputs/apk/release/*.apk" >> "$GITHUB_OUTPUT"
          else
            echo "Notice: NYXORA_KEYSTORE_BASE64 secret not set; building debug-signed compatible APK."
            if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ] && [ -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ]; then
              base64 --decode "${GITHUB_WORKSPACE}/debug.keystore.base64" > "${GITHUB_WORKSPACE}/debug.keystore"
            elif [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
              keytool -genkeypair -v \
                -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "keystore_path=${GITHUB_WORKSPACE}/debug.keystore" >> "$GITHUB_OUTPUT"
            echo "build_task=:app:assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_glob=app/build/outputs/apk/debug/*.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit & Robolectric Verification Tests
        shell: bash
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest
          fi

      - name: Build Signed NYXORA Browser APK
        id: build_apk
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing_setup.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.NYXORA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NYXORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION_NAME="${{ steps.version_meta.outputs.version_name }}"
          VERSION_CODE="${{ steps.version_meta.outputs.version_code }}"

          # Update versionCode and versionName in app/build.gradle.kts for this release artifact
          sed -i "s/versionCode = [0-9]\+/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]\+\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

          if [ -x "./gradlew" ]; then
            ./gradlew ${{ steps.signing_setup.outputs.build_task }}
          else
            gradle ${{ steps.signing_setup.outputs.build_task }}
          fi

          FOUND_APK=$(ls ${{ steps.signing_setup.outputs.apk_glob }} | grep -v "unsigned" | head -n 1)
          if [ -z "$FOUND_APK" ] || [ ! -s "$FOUND_APK" ]; then
            echo "Error: Signed APK artifact was not produced!"
            exit 1
          fi

          RELEASE_APK_NAME="NYXORA-Browser-v${VERSION_NAME}-universal.apk"
          cp "$FOUND_APK" "$RELEASE_APK_NAME"
          SHA256_SUM=$(sha256sum "$RELEASE_APK_NAME" | awk '{print $1}')
          echo "${SHA256_SUM}  ${RELEASE_APK_NAME}" > "${RELEASE_APK_NAME}.sha256"

          echo "apk_file=${RELEASE_APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256_file=${RELEASE_APK_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256_sum=${SHA256_SUM}" >> "$GITHUB_OUTPUT"

      - name: Publish Versioned GitHub Release with Verified APK Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.tag_name }}
          name: "NYXORA Browser ${{ steps.version_meta.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ${{ github.event.inputs.release_notes || 'Stable NYXORA Browser Android release.' }}

            ### Package Verification
            - **Package ID**: `com.aistudio.nyxorabrowser.vqxkpl`
            - **Version**: `${{ steps.version_meta.outputs.version_name }}` (`versionCode ${{ steps.version_meta.outputs.version_code }}`)
            - **APK Asset**: `${{ steps.build_apk.outputs.apk_file }}`
            - **SHA-256**: `${{ steps.build_apk.outputs.sha256_sum }}`
          files: |
            ${{ steps.build_apk.outputs.apk_file }}
            ${{ steps.build_apk.outputs.sha256_file }}
